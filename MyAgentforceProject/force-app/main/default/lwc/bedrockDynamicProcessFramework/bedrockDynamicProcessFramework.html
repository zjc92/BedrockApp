<template>
    <lightning-card title="Business Process Workspace" icon-name="standard:process">
        <div class="slds-card__body slds-card__body_inner">

            <!-- Loading state -->
            <template lwc:if={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_medium">
                    <lightning-spinner alternative-text="Loading process steps..." size="small"></lightning-spinner>
                </div>
            </template>

            <!-- Error state -->
            <template lwc:elseif={hasError}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2>{errorMessage}</h2>
                </div>
            </template>

            <!-- Empty state -->
            <template lwc:elseif={isEmpty}>
                <div class="slds-illustration slds-illustration_small slds-p-around_medium">
                    <div class="slds-text-longform">
                        <p class="slds-text-body_regular slds-text-color_weak">No process steps configured for this record type.</p>
                    </div>
                </div>
            </template>

            <!-- Process steps path -->
            <template lwc:elseif={hasSteps}>
                <div class="slds-path" role="navigation" aria-label="Business Process">
                    <div class="slds-grid slds-path__track">
                        <div class="slds-grid slds-path__scroller-container">
                            <div class="slds-path__scroller" role="application">
                                <div class="slds-path__scroller_inner">
                                    <ul class="slds-path__nav" role="listbox" aria-orientation="horizontal">
                                        <template for:each={processSteps} for:item="step">
                                            <li
                                                key={step.id}
                                                class={step.cssClass}
                                                role="presentation"
                                            >
                                                <button
                                                    class="slds-path__link"
                                                    role="option"
                                                    aria-selected={step.isSelected}
                                                    data-stepid={step.id}
                                                    data-stepindex={step.displayOrder}
                                                    onclick={handleStepClick}
                                                    title={step.stepLabel}
                                                >
                                                    <span class="slds-path__stage">
                                                        <lightning-icon
                                                            icon-name="utility:check"
                                                            size="x-small"
                                                            alternative-text="Completed"
                                                        ></lightning-icon>
                                                        <span class="slds-assistive-text">{step.statusLabel}</span>
                                                    </span>
                                                    <span class="slds-path__title">{step.stepLabel}</span>
                                                </button>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

        </div>
    </lightning-card>

    <!-- Step detail modal -->
    <template lwc:if={isModalOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-labelledby="modal-heading"
            aria-modal="true"
            aria-describedby="modal-content"
            class="slds-modal slds-fade-in-open"
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={handleModalClose}
                    >
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading" class="slds-modal__title slds-hyphenate">
                        {selectedStep.stepLabel}
                    </h2>
                    <p class="slds-m-top_x-small">
                        <lightning-badge label={selectedStep.actionType} class="action-type-badge"></lightning-badge>
                    </p>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content">
                    <template lwc:if={selectedStep.description}>
                        <p class="slds-text-body_regular">{selectedStep.description}</p>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-body_regular slds-text-color_weak">No description available for this step.</p>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={handleModalClose}>Close</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
