<template>
    <lightning-card title="Business Process Workspace" icon-name="custom:custom62">
        <div class="slds-card__body slds-card__body_inner">

            <!-- Error state -->
            <template lwc:if={hasError}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2>{errorMessage}</h2>
                </div>
            </template>

            <!-- Empty state -->
            <template lwc:elseif={isEmpty}>
                <div class="slds-illustration slds-illustration_small slds-p-around_medium">
                    <div class="slds-text-longform">
                        <p class="slds-text-body_regular slds-text-color_weak">{emptyMessage}</p>
                    </div>
                </div>
            </template>

            <!-- Chevron path layout -->
            <template lwc:elseif={isChevron}>
                <div class="slds-path" role="navigation" aria-label="Business Process">
                    <div class="slds-grid slds-path__track">
                        <div class="slds-grid slds-path__scroller-container">
                            <div class="slds-path__scroller" role="application">
                                <div class="slds-path__scroller_inner">
                                    <ul
                                        class="slds-path__nav"
                                        role="listbox"
                                        aria-orientation="horizontal"
                                    >
                                        <template for:each={processSteps} for:item="step">
                                            <li
                                                key={step.stepId}
                                                class={step.computedClass}
                                                role="presentation"
                                            >
                                                <a
                                                    class="slds-path__link"
                                                    role="option"
                                                    aria-selected={step.isSelected}
                                                    data-id={step.stepId}
                                                    onclick={handleChevronClick}
                                                    title={step.stepLabel}
                                                    href="javascript:void(0);"
                                                >
                                                    <span class="slds-path__stage">
                                                        <lightning-icon
                                                            icon-name="utility:check"
                                                            size="x-small"
                                                            alternative-text="Completed"
                                                        ></lightning-icon>
                                                    </span>
                                                    <span class="slds-path__title">{step.stepLabel}</span>
                                                </a>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Button layout -->
            <template lwc:elseif={isButtons}>
                <div class="slds-button-group slds-p-around_small" role="group" aria-label="Process Steps">
                    <template for:each={processSteps} for:item="step">
                        <lightning-button
                            key={step.stepId}
                            label={step.stepLabel}
                            variant={step.buttonVariant}
                            data-id={step.stepId}
                            onclick={handleChevronClick}
                            class="slds-m-right_x-small"
                        ></lightning-button>
                    </template>
                </div>
            </template>

        </div>
    </lightning-card>

    <!-- Step detail modal -->
    <template lwc:if={isModalOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-labelledby="modal-heading"
            aria-modal="true"
            aria-describedby="modal-content"
            class="slds-modal slds-fade-in-open"
        >
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={closeModal}
                    >
                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            size="small"
                        ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading" class="slds-modal__title slds-hyphenate">
                        {selectedStep.stepLabel}
                    </h2>
                    <p class="slds-m-top_x-small">
                        <lightning-badge
                            label={selectedStep.actionType}
                            class="action-type-badge"
                        ></lightning-badge>
                    </p>
                </header>

                <div class="slds-modal__content slds-p-around_medium" id="modal-content">
                    <template lwc:if={selectedStep.description}>
                        <p class="slds-text-body_regular">{selectedStep.description}</p>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-body_regular slds-text-color_weak">
                            No description available for this step.
                        </p>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Close"
                        variant="brand"
                        onclick={closeModal}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
