<template>
    <lightning-card title="Indirect Account Relationships" icon-name="standard:account">
        <div class="slds-m-around_medium">

            <!-- Loading -->
            <template lwc:if={isLoading}>
                <lightning-spinner
                    alternative-text="Loading indirect account relationships"
                    size="medium">
                </lightning-spinner>
            </template>

            <!-- Error -->
            <template lwc:if={hasError}>
                <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <p>{errorMessage}</p>
                </div>
            </template>

            <!-- Tree view -->
            <template lwc:if={hasData}>

                <!-- Section 1: Current Account → Direct Contacts -->
                <div class="slds-m-bottom_medium">
                    <h2 class="slds-text-heading_small slds-m-bottom_small">Direct Contacts</h2>

                    <!-- Root: current account (plain label — this IS the current record) -->
                    <div class="slds-media slds-media_center slds-m-bottom_x-small">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:account" size="small" alternative-text="Account"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <strong class="slds-text-body_regular">{rootAccountName}</strong>
                        </div>
                    </div>

                    <!-- Direct contact branches -->
                    <template for:each={directContacts} for:item="contact">
                        <div key={contact.contactId} class="slds-media slds-media_center branch-contact slds-m-bottom_xx-small">
                            <div class="slds-media__figure branch-line">
                                <lightning-icon icon-name="standard:contact" size="x-small" alternative-text="Contact"></lightning-icon>
                            </div>
                            <div class="slds-media__body slds-grid slds-wrap slds-grid_vertical-align-center">
                                <!-- Contact name link -->
                                <button
                                    class="slds-button slds-button_reset record-link slds-m-right_x-small"
                                    data-recordid={contact.contactId}
                                    data-objectapiname="Contact"
                                    onclick={navigateToRecord}>
                                    {contact.contactName}
                                </button>
                                <!-- One badge per role -->
                                <template for:each={contact.roles} for:item="roleEntry">
                                    <span key={roleEntry.key} class="slds-badge slds-m-right_xx-small role-badge">
                                        {roleEntry.label}
                                    </span>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Divider -->
                <hr class="slds-m-vertical_medium" />

                <!-- Section 2: Indirect Accounts via Shared Contacts -->
                <div>
                    <h2 class="slds-text-heading_small slds-m-bottom_small">Indirect Accounts via Shared Contacts</h2>

                    <template for:each={indirectAccounts} for:item="account">
                        <div key={account.accountId} class="slds-box slds-box_x-small slds-m-bottom_small indirect-account-card">

                            <!-- Account header with link -->
                            <div class="slds-media slds-media_center slds-m-bottom_x-small">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:account" size="small" alternative-text="Indirect Account"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <button
                                        class="slds-button slds-button_reset record-link record-link_account"
                                        data-recordid={account.accountId}
                                        data-objectapiname="Account"
                                        onclick={navigateToRecord}>
                                        {account.accountName}
                                    </button>
                                </div>
                            </div>

                            <!-- Account metadata -->
                            <div class="slds-grid slds-wrap slds-m-bottom_x-small account-meta">
                                <template lwc:if={account.industry}>
                                    <div class="slds-col slds-size_1-of-2">
                                        <span class="slds-text-color_weak slds-text-body_small">Industry: </span>
                                        <span class="slds-text-body_small">{account.industry}</span>
                                    </div>
                                </template>
                                <template lwc:if={account.formattedRevenue}>
                                    <div class="slds-col slds-size_1-of-2">
                                        <span class="slds-text-color_weak slds-text-body_small">Annual Revenue: </span>
                                        <span class="slds-text-body_small">{account.formattedRevenue}</span>
                                    </div>
                                </template>
                                <div class="slds-col slds-size_1-of-2">
                                    <span class="slds-text-color_weak slds-text-body_small">Shared Contacts: </span>
                                    <span class="slds-text-body_small">{account.sharedContactCount}</span>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <span class="slds-text-color_weak slds-text-body_small">Total Relationships: </span>
                                    <span class="slds-text-body_small">{account.relationshipCount}</span>
                                </div>
                            </div>

                            <!-- Shared contact branches -->
                            <template for:each={account.sharedContacts} for:item="shared">
                                <div key={shared.contactId} class="slds-media slds-media_center branch-contact slds-m-bottom_xx-small">
                                    <div class="slds-media__figure branch-line">
                                        <lightning-icon icon-name="standard:contact" size="x-small" alternative-text="Shared Contact"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body slds-grid slds-wrap slds-grid_vertical-align-center">
                                        <!-- Contact name link -->
                                        <button
                                            class="slds-button slds-button_reset record-link slds-m-right_x-small"
                                            data-recordid={shared.contactId}
                                            data-objectapiname="Contact"
                                            onclick={navigateToRecord}>
                                            {shared.contactName}
                                        </button>
                                        <!-- One badge per role -->
                                        <template for:each={shared.roles} for:item="roleEntry">
                                            <span key={roleEntry.key} class="slds-badge slds-m-right_xx-small role-badge">
                                                {roleEntry.label}
                                            </span>
                                        </template>
                                    </div>
                                </div>
                            </template>

                        </div>
                    </template>
                </div>

            </template>

            <!-- Empty state -->
            <template lwc:if={isEmpty}>
                <div class="slds-box slds-text-align_center slds-theme_shade">
                    <p class="slds-text-color_weak">
                        No indirect account relationships found for this record.
                    </p>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
